schema_version: 1
repo: gbrain-aio
github_repo: wgross19/gbrain-aio
app_slug: gbrain-aio
image:
  name: dub19/gbrain-aio
  cache_scope: gbrain-aio-image
  pytest_tag: gbrain-aio:pytest
  publish_platforms: linux/amd64,linux/arm64
release:
  name: GBrain AIO
  profile: changelog-version
  previous_tag_command: latest-aio-tag
upstream:
  name: GBrain
  version_key: UPSTREAM_VERSION
  digest_arg: UPSTREAM_IMAGE_DIGEST
  monitor:
    - component: gbrain
      name: GBrain
      source: github-tags
      repo: garrytan/gbrain
      dockerfile: Dockerfile
      version_key: UPSTREAM_VERSION
      commit_key: GBRAIN_GIT_SHA
      stable_only: true
      strategy: pr
      release_notes_url: https://github.com/garrytan/gbrain/releases
    - component: bun
      name: Bun
      source: github-releases
      repo: oven-sh/bun
      image: oven/bun
      digest_source: dockerhub
      dockerfile: Dockerfile
      version_key: BUN_VERSION
      digest_key: BUN_DIGEST
      version_strip_prefix: bun-v
      stable_only: true
      strategy: notify
      release_notes_url: https://github.com/oven-sh/bun/releases
    - component: caddy
      name: Caddy
      source: github-tags
      repo: caddyserver/caddy
      image: caddy
      digest_source: dockerhub
      dockerfile: Dockerfile
      version_key: CADDY_VERSION
      digest_key: CADDY_DIGEST
      stable_only: true
      strategy: pr
      release_notes_url: https://github.com/caddyserver/caddy/releases
template:
  xml_paths:
    - gbrain-aio.xml
  generated: false
catalog:
  published: true
  assets:
    - source: gbrain-aio.xml
      target: gbrain-aio.xml
    - source: assets/app-icon.png
      target: icons/gbrain.png
tests:
  unit: tests/test_dockerfile_policy.py
  integration: tests/integration -m integration --timeout=90
  checkout_submodules: false
