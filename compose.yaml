# GBrain vanilla AIO — Unraid Compose Manager
# One service. Custom image. Postgres is inside the container on 127.0.0.1.
# Do not publish 5432. Do not give agents DATABASE_URL.

name: gbrain-vanilla

services:
  gbrain-vanilla:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GBRAIN_GIT_SHA: ${GBRAIN_GIT_SHA:-864dec4f199f420dba1ea6c5bc72e824e09de978}
        BUN_IMAGE: ${BUN_IMAGE:-oven/bun:1.3.10}
    image: ${GBRAIN_VANILLA_IMAGE:-gbrain-vanilla-aio:v0.46.14.0}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gbrain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-gbrain}
      GBRAIN_DB_HOST: "127.0.0.1"
      GBRAIN_DB_PORT: "5432"
      GBRAIN_HTTP_PORT: "3131"
      GBRAIN_HTTP_BIND: "127.0.0.1"
      GBRAIN_PUBLIC_URL: ${GBRAIN_PUBLIC_URL:-https://192.168.1.10:3132}
      GBRAIN_ADMIN_BOOTSTRAP_TOKEN: ${GBRAIN_ADMIN_BOOTSTRAP_TOKEN:-}
      GBRAIN_LAN_BIND: ${GBRAIN_LAN_BIND:-192.168.1.10}
      BRAIN_UID: ${BRAIN_UID:-999}
      BRAIN_GID: ${BRAIN_GID:-100}
      SOURCE_NAME: ${SOURCE_NAME:-cortext-test}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://192.168.1.10:11434/v1}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-ollama}
      TOGETHER_API_KEY: ${TOGETHER_API_KEY:-ollama}
    ports:
      - "127.0.0.1:${GBRAIN_HOST_PORT:-3132}:3132"
      - "${GBRAIN_LAN_BIND:-192.168.1.10}:${GBRAIN_HOST_PORT:-3132}:3132"
    volumes:
      - ${APPDATA_ROOT:-/mnt/user/appdata/Compose/gbrain-vanilla}/data/postgres:/data/postgres
      - ${APPDATA_ROOT:-/mnt/user/appdata/Compose/gbrain-vanilla}/gbrain-home:/var/lib/gbrain
      - ${APPDATA_ROOT:-/mnt/user/appdata/Compose/gbrain-vanilla}/caddy:/config/caddy
      - ${BRAIN_PATH:-/mnt/user/cortext-test}:/${SOURCE_NAME:-cortext-test}
      - ./rootfs/etc/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3131/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    security_opt:
      - no-new-privileges:true
